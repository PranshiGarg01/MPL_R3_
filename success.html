<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treasure Hunt - Completed!</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="hud-corner tl"></div><div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div><div class="hud-corner br"></div>

  <header class="nav-strip">
    <span class="nav-logo">
      <img src="./assets/mpl-logo.png" alt="Event logo" />
    </span>
    <span class="nav-title">TREASURE HUNT</span>
    <span class="nav-logo">
      <img src="./assets/siam-logo.png" alt="Chapter logo" />
    </span>
  </header>

  <main class="container">
    <div class="clue-box">

      <div class="trophy-wrap">
        <svg class="sparkle-burst s1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 6L20 9l-6 1.5L12 17l-1.5-6.5L4 9l6.5-1L12 2z"/></svg>
        <svg class="sparkle-burst s2" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 6L20 9l-6 1.5L12 17l-1.5-6.5L4 9l6.5-1L12 2z"/></svg>
        <svg class="sparkle-burst s3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 6L20 9l-6 1.5L12 17l-1.5-6.5L4 9l6.5-1L12 2z"/></svg>
        <svg class="trophy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 4h10v3a5 5 0 01-10 0V4z"/>
          <path d="M7 5H4.5A2.5 2.5 0 007 7.5M17 5h2.5A2.5 2.5 0 0117 7.5"/>
          <path d="M12 12v4M9 20h6M8 20l.5-4h7l.5 4"/>
        </svg>
      </div>

      <h1>Treasure Found!</h1>
      <div class="stamp">Mission Complete</div>

      <p class="riddle-text">You have followed every clue and reached the end of the trail.</p>
      <p class="riddle-text" style="color: var(--gold-light); font-weight:bold;">
        Report back to the venue.
      </p>

    </div>
  </main>
</body>
</html>
